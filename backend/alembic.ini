# Alembic config (ASCII-only: Windows locale encoding cannot read UTF-8 Chinese comments)

[alembic]
# path to migration scripts
script_location = alembic

# file naming template
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# timezone
timezone = UTC

# database URL (always overridden by MIGRATION_DATABASE_URL/settings in env.py)
sqlalchemy.url = postgresql+psycopg://fastapi_admin_migrator:password@localhost:5432/fastapi_admin

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
