[project]
name = "backend"
version = "0.1.0"
description = "FastAPI 权限管理系统后端"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.19.0,<2",
    "bcrypt>=5.0,<6",
    "fastapi>=0.141.1,<1",
    "psycopg[binary]>=3.3,<4",
    "pydantic[email]>=2.12,<3",
    "pydantic-settings>=2.14.2,<3",
    "pwdlib[argon2,bcrypt]>=0.3,<1",
    "pyjwt>=2.13,<3",
    "python-multipart>=0.0.32,<1",
    "sqlalchemy>=2.0.51,<3",
    "uvicorn[standard]>=0.52.1,<1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1,<1",
    "httpx>=0.28.1,<1",
    "mypy>=2.3,<3",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.16,<1",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "ASYNC"]
ignore = ["E501", "B008", "UP046"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["N802", "N803"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
